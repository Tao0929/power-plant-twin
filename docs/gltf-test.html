<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scene.gltf 模型测试</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/@react-three/fiber@8.15.15/dist/index.umd.min.js"></script>
  <script src="https://unpkg.com/@react-three/drei@9.91.0/dist/index.umd.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    h1 {
      color: #00d4ff;
      margin-bottom: 10px;
    }
    .description {
      color: #b0b0b0;
      max-width: 800px;
      margin: 0 auto;
    }
    #root {
      width: 100%;
      height: 600px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.15);
      background: #0a0a0a;
    }
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.3s ease;
    }
    .loading-overlay.hide {
      opacity: 0;
      pointer-events: none;
    }
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0, 212, 255, 0.3);
      border-radius: 50%;
      border-top-color: #00d4ff;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .error-message {
      color: #ff4444;
      text-align: center;
      padding: 20px;
      background: rgba(255, 68, 68, 0.1);
      border-radius: 10px;
      margin-top: 20px;
    }
    .controls-info {
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      font-size: 14px;
    }
    .controls-info h3 {
      color: #00d4ff;
      margin-top: 0;
      margin-bottom: 10px;
    }
    .controls-info p {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Scene.gltf 模型测试</h1>
      <p class="description">
        此页面用于测试scene.gltf模型的加载和渲染效果。如果一切正常，您将看到一个交互式的3D模型视图。
      </p>
    </header>
    
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-spinner"></div>
      <div>加载scene.gltf模型...</div>
    </div>
    
    <div id="root"></div>
    
    <div id="errorContainer" style="display: none;"></div>
    
    <div class="controls-info">
      <h3>操作指南</h3>
      <p>🖱️ 左键拖动：旋转视角</p>
      <p>🖱️ 右键拖动：平移视角</p>
      <p>🖱️ 滚轮：缩放视角</p>
    </div>
  </div>

  <script type="text/babel">
    // 配置Babel
    Babel.registerPreset('react', {
      presets: [Babel.availablePresets['react']]
    });

    // 获取必要的库
    const { createRoot } = ReactDOM;
    const { Canvas } = window['@react-three/fiber'];
    const { OrbitControls, useGLTF, Html, Environment, Suspense } = window['@react-three/drei'];
    const { useState, useEffect, useRef } = React;
    const { AxesHelper } = THREE;

    // 加载场景模型的组件 - 简化版本
    function SceneModel() {
      try {
        // 使用useGLTF加载模型
        const { scene } = useGLTF('./scene.gltf');
        const [modelLoaded, setModelLoaded] = useState(false);

        // 模型加载后调整大小和位置
        useEffect(() => {
          if (scene) {
            console.log('scene.gltf 模型已加载', scene);
            
            // 调整模型大小以适合视图
            scene.scale.set(0.01, 0.01, 0.01); // 根据实际模型大小调整
            scene.position.set(0, -5, 0); // 调整位置
            
            setModelLoaded(true);
            
            // 隐藏加载指示器
            document.getElementById('loadingOverlay').classList.add('hide');
          }
        }, [scene]);

        return (
          <>
            <primitive object={scene} dispose={null} />
            <AxesHelper args={[10]} />
            
            {modelLoaded && (
              <Html position={[0, 15, 0]}>
                <div style={{
                  background: 'rgba(0, 0, 0, 0.7)',
                  color: '#00d4ff',
                  padding: '8px 12px',
                  borderRadius: '4px',
                  fontSize: '12px'
                }}>
                  模型已加载成功
                </div>
              </Html>
            )}
          </>
        );
      } catch (error) {
        console.error('模型加载错误:', error);
        document.getElementById('loadingOverlay').classList.add('hide');
        const errorContainer = document.getElementById('errorContainer');
        errorContainer.innerHTML = `<div class="error-message">
          <h3>加载错误</h3>
          <p>无法加载scene.gltf模型，请检查控制台获取详细错误信息。</p>
          <p>错误信息: ${error.message}</p>
        </div>`;
        errorContainer.style.display = 'block';
        return null;
      }
    }

    // 主3D场景组件
    function Scene() {
      return (
        <>
          {/* 基本光照设置 */}
          <color attach="background" args={['#0a0a0a']} />
          <ambientLight intensity={0.6} />
          <directionalLight position={[10, 10, 5]} intensity={1} castShadow />
          
          {/* 加载和显示模型 */}
          <Suspense fallback={<Html center><div>加载中...</div></Html>}>
            <SceneModel />
          </Suspense>
          
          {/* 交互控制器 */}
          <OrbitControls 
            enablePan={true} 
            enableZoom={true} 
            enableRotate={true}
            minDistance={5} 
            maxDistance={100}
          />
        </>
      );
    }

    // 主要的3D模型展示组件
    function GLTFSceneViewer() {
      return (
        <Canvas 
          camera={{
            position: [20, 20, 20],
            fov: 50,
            near: 0.1,
            far: 1000
          }}
        >
          <Scene />
        </Canvas>
      );
    }

    // 渲染应用
    try {
      const root = createRoot(document.getElementById('root'));
      root.render(
        <React.StrictMode>
          <GLTFSceneViewer />
        </React.StrictMode>
      );

      // 尝试预加载模型
      if (window['@react-three/drei']?.useGLTF?.preload) {
        try {
          window['@react-three/drei'].useGLTF.preload('./scene.gltf');
        } catch (e) {
          console.log('预加载可选，不影响主要功能:', e);
        }
      }

      // 全局错误处理
      window.addEventListener('error', function(e) {
        console.error('全局错误:', e.error);
        document.getElementById('loadingOverlay').classList.add('hide');
        const errorContainer = document.getElementById('errorContainer');
        errorContainer.innerHTML = `<div class="error-message">
          <h3>加载错误</h3>
          <p>发生了一个错误，请检查控制台获取详细信息。</p>
        </div>`;
        errorContainer.style.display = 'block';
      });

    } catch (error) {
      console.error('应用渲染错误:', error);
      document.getElementById('loadingOverlay').classList.add('hide');
      const errorContainer = document.getElementById('errorContainer');
      errorContainer.innerHTML = `<div class="error-message">
        <h3>应用启动错误</h3>
        <p>无法启动应用，请检查控制台获取详细错误信息。</p>
      </div>`;
      errorContainer.style.display = 'block';
    }
  </script>
</body>
</html>
